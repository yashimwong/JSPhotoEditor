<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&family=Oswald&family=Roboto&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <title>JSPhoto Editor</title>
</head>
<body>
    <div class="tool-bar">
        <div id="new_image" class="tool"><i class="far fa-image"></i>New Image</div>
        <input id="load_image" type="file" accept="image/*" class="tool">
        <button id="rotate_left" class="tool" type="button"><i class="fas fa-rotate-left"></i>Rotate Left</button>
        <button id="rotate_right" class="tool" type="button"><i class="fas fa-rotate-right"></i>Rotate Right</button>
        <button id="flip_horizontal" class="tool" type="button"><i class="fas fa-arrows-left-right"></i>Flip Horizontal</button>
        <button id="flip_vertical" class="tool" type="button"><i class="fas fa-arrows-up-down"></i>Flip Vertical</button>
        <button id="undo" class="tool" type="button"><i class="fas fa-rotate-left"></i>Undo</button>
        <button id="redo" class="tool" type="button"><i class="fas fa-rotate-right"></i>Redo</button>
        <div id="open_save_dialogue" class="tool"><i class="far fa-save"></i>Save Image</div>
    </div>
    <div class="side-bar">
        <div class="tool-group">
            <div id="correction" class="tool"><i class="fas fa-edit"></i>Correction</div>
            <div class="sub-tool">
                <label>Exposure: <input id="exposure" data-filter="brightness" type="range" min="-100" max="100" value="0"></label>
                <label>Contrast: <input id="contrast" type="range" min="-100" max="100" value="0"></label>
            </div>
        </div>
        <div class="tool-group">
            <div id="draw_shapes" class="tool"><i class="fas fa-edit"></i>Draw Shapes</div>
            <div class="sub-tool">
                <label>Color: <input id="shape_color" type="color" value="#111827"></label>
                <label>Opacity: <input id="shape_opacity" type="range" min="0" max="100" value="100"></label>
                <label>Size: <input id="shape_size" type="range" min="10" max="200" value="100"></label>
            </div>
            <div id="circle_tool" class="sub-tool" data-shape="circle">Circle</div>
            <div id="rectangle_tool" class="sub-tool" data-shape="rectangle">Rectangle</div>
            <div id="triangle_tool" class="sub-tool" data-shape="triangle">Triangle</div>
            <button id="remove_last_shape" class="sub-tool" type="button">Remove Last Shape</button>
        </div>
        <div class="tool-group">
            <div id="blur_tool" class="tool"><i class="fas fa-quidditch"></i>Blur</div>
            <div class="sub-tool">
                <label>Radius: <input id="blur_radius" type="range" min="0" max="50" value="0"></label>
                <label>Strength: <input id="blur_strength" type="range" min="0" max="100" value="0"></label>
            </div>
        </div>
        <div class="tool-group">
            <div id="sharpen_tool" class="tool"><i class="fab fa-codepen"></i>Sharpen</div>
            <div class="sub-tool">
                <label>Strength: <input id="sharpen_strength" type="range" min="0" max="100" value="0"></label>
            </div>
        </div>
        <div class="tool-group">
            <div class="tool"><i class="fas fa-adjust"></i>Color Adjustments</div>
            <div class="sub-tool">
                <label>Grayscale: <input id="grayscale" type="range" min="0" max="100" value="0"></label>
                <label>Saturation: <input id="saturation" type="range" min="0" max="200" value="100"></label>
            </div>
        </div>
        <div class="tool-group">
            <div id="color_filter_tool" class="tool"><i class="fas fa-palette"></i>Color Filter</div>
            <div class="sub-tool">
                <label>Color: <input id="color_picker" type="color" value="#fdffff"></label>
                <label>Opacity: <input id="color_opacity" type="range" min="0" max="100" value="0"></label>
            </div>
        </div>
        <div id="clear_all" class="tool"><i class="fas fa-edit"></i>Clear All</div>
    </div>
    <div class="image-canvas">
        <canvas id="canvas"></canvas>
    </div>
    <div id="save_image_modal" class="modal">
        <div class="modal-content">
            <span id="modal_close_btn" class="modal-close">&times;</span>
            Save Image As:
            <select id="image_format">
                <option value="png">png</option>
                <option value="jpeg">jpeg</option>
                <option value="webp">webp</option>
            </select>
            <label id="image_compression_label">Image Compression: <input id="image_compression" type="range" min="0" max="1" step="0.1" value="1"></label>
            <button id="modal_save_btn">Save</button>
            <button id="modal_cancel_btn">Cancel</button>
        </div>
    </div>
    <script src="js/main.js"></script>
    <script src="js/draw.js"></script>
</body>
</html>
